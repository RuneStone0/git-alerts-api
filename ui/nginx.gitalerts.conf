# GitAlerts: static UI + same-origin proxy to the Django API (see deploy_git_alerts.py).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Explicit API prefixes.
    location ^~ /api/    { proxy_pass http://api:8000; }
    location ^~ /admin/  { proxy_pass http://api:8000; }
    location ^~ /static/ { proxy_pass http://api:8000; }

    # Every API route ends with a trailing slash (/scans/, /scans/12/, /settings/,
    # /finding-ignores/types/); the SPA routes are the same words WITHOUT it (/scans,
    # /scans/12), so this single rule routes both surfaces without a name-by-name list.
    location ~ ^/(?:[A-Za-z0-9._-]+/)+(?:[0-9]+/)?$ { proxy_pass http://api:8000; }

    # Hashed bundles never change under the same name, so cache them hard. index.html must
    # never be cached: otherwise a browser keeps loading the previous bundle after a deploy,
    # which makes a fixed build look broken.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # SPA + hashed assets. Deep links (/scans/12, /login) fall back to index.html.
    location / { try_files $uri $uri/ /index.html; }
}
